<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Platformer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" role="img"
                aria-label="Procedural platformer game area. Use arrow keys or A and D to move, Space to jump.">
            Your browser does not support the canvas element. This game requires a modern browser with JavaScript enabled.
        </canvas>

        <!-- UI Overlays -->
        <div id="menu-screen" class="overlay">
            <h1>Procedural Platformer</h1>
            <button id="start-btn" aria-label="Start Game">Start Game</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h2>Game Over</h2>
            <p id="final-score">Score: 0</p>
            <button id="retry-btn" aria-label="Try Again">Try Again</button>
        </div>

        <div id="level-complete-screen" class="overlay hidden">
            <h2>Level Complete!</h2>
        </div>

        <div id="hud">
            <span id="score-display">Score: 0</span>
            <span id="level-display">Level: 1</span>
            <!-- Timer is timed-levels-only (level 5+); a later task toggles visibility. -->
            <span id="timer-display" class="hidden">Time: 1:00</span>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
